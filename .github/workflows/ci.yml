name: Validar biblioteca

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:biome
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:package
